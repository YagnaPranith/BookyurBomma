services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seatsync
      POSTGRES_USER: seatsync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatsync -d seatsync"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/seatsync
      SPRING_DATASOURCE_USERNAME: seatsync
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
      SPRING_DATA_REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the project .env file}
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  web:
    build: ./frontend
    environment:
      BACKEND_HOSTPORT: api:8080
    ports: ["5173:80"]
    depends_on: [api]
volumes:
  pgdata:
