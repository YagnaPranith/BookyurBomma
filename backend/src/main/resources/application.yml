spring:
  application:
    name: seatsync
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/seatsync}
    username: ${SPRING_DATASOURCE_USERNAME:seatsync}
    password: ${SPRING_DATASOURCE_PASSWORD:local-dev-only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
seatsync:
  jwt:
    secret: ${JWT_SECRET}
    ttl-hours: 12
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
server:
  error:
    include-message: never
