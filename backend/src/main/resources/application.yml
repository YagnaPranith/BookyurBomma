spring:
  application:
    name: seatsync
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:seatsync}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:seatsync}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:local-dev-only}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
seatsync:
  jwt:
    secret: ${JWT_SECRET}
    ttl-hours: 12
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
server:
  port: ${PORT:8080}
  error:
    include-message: never
